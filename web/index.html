<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1115" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#8a5d00" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>rev</title>
    <script>
      // Pre-paint theme resolution; src/theme.ts takes over after mount.
      var p = null;
      try {
        p = localStorage.getItem("rev.theme");
      } catch {}
      var s =
        p === "light" || p === "dark"
          ? p
          : matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
      document.documentElement.dataset.theme = s;
      if (s === "light")
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", "#f4f5f7");
    </script>
  </head>
  <body>
    <!--
    THESIS: a review daemon's console — the diff is the page; refuses the
    web-app dashboard arrangement of cards and heros.
    OWN-WORLD: graphite (#0e1115) with hairline edges, mono for everything
    git-shaped, one amber accent carrying attention (stale, open comments,
    current file); green/red reserved for diff semantics.
    STORY: dev lands from an agent link, reads hunks top to bottom, marks
    files seen, drops line comments; the page stays live as the tree moves.
    FIRST VIEWPORT: sticky repo header, file rail left, first diff hunks
    already open; primary action is the diff itself.
    FORM: brief-pinned native dev tool (Operate); no concept roll — headless
    autonomous session, direction fixed by the brief.
    FINISH: unreviewed and undocumented is unfinished; this build ends with
    the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
